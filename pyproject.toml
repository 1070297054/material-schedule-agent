[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "material-schedule-agent"
version = "0.3.0"
description = "Auditable material review and scheduling draft agent"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
schedule-agent = "schedule_agent.cli:main"
schedule-agent-web = "schedule_agent.server:main"
schedule-agent-campaign = "schedule_agent.campaign_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schedule_agent = ["web/*.html", "web/*.css", "web/*.js"]
